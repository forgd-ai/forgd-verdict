# The Claude Code hook as its own install name. This distribution holds no
# modules: an exact pin on forgd-verdict plus one console script.
# cut_release.sh bumps `version` and the pin together.
[project]
name = "forgd-verdict-hook"
version = "1.2.5"
description = "Claude Code hook for forgd-verdict: scan prompts and tool calls before they run."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "forgd", email = "oss@forgd.ai" }]
keywords = ["dlp", "claude-code", "hooks"]
dependencies = ["forgd-verdict==1.2.5"]

[project.urls]
Homepage = "https://github.com/forgd-ai/forgd-verdict"
Documentation = "https://github.com/forgd-ai/forgd-verdict#readme"
Source = "https://github.com/forgd-ai/forgd-verdict"
Issues = "https://github.com/forgd-ai/forgd-verdict/issues"

[project.scripts]
forgd-verdict-hook = "forgd_verdict.hook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No package to select; the wheel carries metadata and the entry point only.
bypass-selection = true
