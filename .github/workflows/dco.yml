name: dco

# Every commit in a pull request must carry a `Signed-off-by:` trailer
# naming its author. The check runs scripts/check_dco.sh as committed at
# the pull request's base, so a pull request cannot change the check it is
# held to.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: every commit is signed off
    # Runs in the public repository only; a fork does not enforce sign-off.
    if: github.repository == 'forgd-ai/forgd-verdict'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          git show "$BASE:scripts/check_dco.sh" > "$RUNNER_TEMP/check_dco.sh"
          bash "$RUNNER_TEMP/check_dco.sh" "$BASE" "$HEAD"
