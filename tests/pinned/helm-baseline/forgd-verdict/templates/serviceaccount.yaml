{{/*
Two identities, not one.

The dashboard is the only service here a human signs into. Giving it the
writer identity would mean a compromise of the sign-in path could rewrite
the findings -- rewriting the evidence. So it gets read-only access --
Storage Blob Data Reader on Azure, store-s3's reader role on AWS,
store-gcs's reader service account on Google Cloud -- and the
other three roles get write access, and the separation is enforced by the
cloud's access control rather than by the app.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forgd-verdict.writerServiceAccountName" . }}
  labels:
    {{- include "forgd-verdict.labels" . | nindent 4 }}
    forgd.ai/store-access: writer
  annotations:
    {{- with .Values.serviceAccounts.writer.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.workloadIdentity.enabled }}
    {{- if not .Values.serviceAccounts.writer.clientId }}
    {{- fail "serviceAccounts.writer.clientId is required when workloadIdentity.enabled: the pod would fall back to whatever credential the node offers, and the failure surfaces as an empty dashboard rather than as an auth error" }}
    {{- end }}
    azure.workload.identity/client-id: {{ .Values.serviceAccounts.writer.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forgd-verdict.readerServiceAccountName" . }}
  labels:
    {{- include "forgd-verdict.labels" . | nindent 4 }}
    forgd.ai/store-access: reader
  annotations:
    {{- with .Values.serviceAccounts.reader.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.workloadIdentity.enabled .Values.dashboard.enabled }}
    {{- if not .Values.serviceAccounts.reader.clientId }}
    {{- fail "serviceAccounts.reader.clientId is required when workloadIdentity.enabled and the dashboard is on; reusing the writer id here would give the sign-in path write access to the findings" }}
    {{- end }}
    {{- if eq .Values.serviceAccounts.reader.clientId .Values.serviceAccounts.writer.clientId }}
    {{- fail "serviceAccounts.reader.clientId equals serviceAccounts.writer.clientId; the dashboard must hold a reader identity, or a compromise of the one service a human signs into can rewrite the findings" }}
    {{- end }}
    azure.workload.identity/client-id: {{ .Values.serviceAccounts.reader.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
{{- if .Values.connector.enabled }}
---
{{/*
The findings connector's. A service account of its own, so it can be
federated and revoked separately, on the READER identity like the
dashboard's: nothing the connector does writes to the store.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forgd-verdict.connectorServiceAccountName" . }}
  labels:
    {{- include "forgd-verdict.labels" . | nindent 4 }}
    forgd.ai/store-access: reader
    app.kubernetes.io/component: connector
  annotations:
    {{- with .Values.serviceAccounts.reader.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.workloadIdentity.enabled }}
    {{- if not .Values.serviceAccounts.reader.clientId }}
    {{- fail "serviceAccounts.reader.clientId is required when workloadIdentity.enabled and the connector is on; the connector holds the reader identity" }}
    {{- end }}
    {{- if eq .Values.serviceAccounts.reader.clientId .Values.serviceAccounts.writer.clientId }}
    {{- fail "serviceAccounts.reader.clientId equals serviceAccounts.writer.clientId; the connector must hold a reader identity, or a caller Claude signs in could rewrite the findings" }}
    {{- end }}
    azure.workload.identity/client-id: {{ .Values.serviceAccounts.reader.clientId | quote }}
    {{- with .Values.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
{{- end }}
