apiVersion: v2
name: forgd-verdict
description: |
  The four forgd-verdict roles on Kubernetes, from one image: the verdict
  server Anthropic calls into, the OTLP collector it pushes to, the read-only
  findings dashboard, and the Compliance API ingest cron.
type: application
# The chart version moves when the templates change; appVersion tracks the
# image. They are deliberately separate -- a fork pinning an older image
# should still get template fixes.
version: 0.1.0
appVersion: "0.29.8"
kubeVersion: ">=1.27.0-0"
home: https://github.com/forgd-ai/forgd-verdict
sources:
  - https://github.com/forgd-ai/forgd-verdict
keywords:
  - dlp
  - claude
  - anthropic
  - compliance
