{{- if not .Values.secrets.existingSecret }}
{{/*
The chart-managed secret, for a lab. `helm get values` shows these, and they
land in the release object in etcd -- so a real deployment points
secrets.existingSecret at external-secrets or the CSI driver instead.

The salt is required whenever anything hashes. Without one, a finding's
excerpt_hash is a plain sha256 of the matched text, and an SSN is about a
billion guesses -- so the hash of a leaked SSN is the SSN.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forgd-verdict.fullname" . }}-secrets
  labels:
    {{- include "forgd-verdict.labels" . | nindent 4 }}
type: Opaque
stringData:
  hash-salt: {{ .Values.secrets.hashSalt | required "secrets.hashSalt is required: without it excerpt_hash is an unsalted sha256, and an SSN or a card number is brute-forceable from the hash alone" | quote }}
  {{- if .Values.verdict.enabled }}
  {{- if .Values.verdict.signingOrgs }}
  {{- with .Values.secrets.webhookSecret }}
  webhook-secret: {{ . | quote }}
  {{- end }}
  {{- else }}
  webhook-secret: {{ .Values.secrets.webhookSecret | required "secrets.webhookSecret is required for the verdict server: the signature check is the only thing authenticating Anthropic" | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookSecretPrevious }}
  # policy.yaml accepts both, so a rotation is: add the new secret here as
  # webhook-secret and move the old one to this key, roll, change it on the
  # Anthropic side, then drop this key. Without it a rotation has a window
  # where in-flight frames are signed with a secret the server no longer
  # holds -- and a rejected frame is a webhook failure, not a deny.
  webhook-secret-previous: {{ . | quote }}
  {{- end }}
  {{- range $name := .Values.verdict.signingOrgs }}
  {{- $entry := get ($.Values.secrets.webhookSecrets | default dict) $name | default dict }}
  webhook-secret-{{ $name | lower }}: {{ $entry.current | required (printf "secrets.webhookSecrets.%s.current is required for verdict.signingOrgs %s (or set secrets.existingSecret with a webhook-secret-%s key): the signature check is the only thing authenticating that org's Inference hook" $name $name ($name | lower)) | quote }}
  {{- with $entry.previous }}
  webhook-secret-{{ $name | lower }}-previous: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.enabled }}
  {{- if or .Values.secrets.managedAgentsKeys .Values.ingest.managedAgentsWorkspaces }}
  {{- if and (not .Values.secrets.complianceKey) (not .Values.secrets.managedAgentsKeys) (not .Values.ingest.complianceOrgs) }}
  {{- fail "the ingest job has no key: set secrets.complianceKey, secrets.managedAgentsKeys, or secrets.existingSecret" }}
  {{- end }}
  {{- with .Values.secrets.complianceKey }}
  compliance-key: {{ . | quote }}
  {{- end }}
  {{- else if .Values.ingest.complianceOrgs }}
  {{- with .Values.secrets.complianceKey }}
  compliance-key: {{ . | quote }}
  {{- end }}
  {{- else }}
  compliance-key: {{ .Values.secrets.complianceKey | required "secrets.complianceKey is required for the ingest job (or configure Managed Agents workspaces instead)" | quote }}
  {{- end }}
  {{- range $name := .Values.ingest.complianceOrgs }}
  compliance-key-{{ $name | lower }}: {{ get ($.Values.secrets.complianceKeys | default dict) $name | required (printf "secrets.complianceKeys.%s is required for ingest.complianceOrgs %s (or set secrets.existingSecret with a compliance-key-%s key)" $name $name ($name | lower)) | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  metrics-token: {{ . | quote }}
  {{- end }}
  {{- if and .Values.dashboard.enabled .Values.dashboard.admins.enabled }}
  dashboard-form-key: {{ .Values.secrets.dashboardFormKey | required "secrets.dashboardFormKey is required while dashboard.admins.enabled (or set secrets.existingSecret with a dashboard-form-key key): the dashboard refuses to start with admins configured and no form key" | quote }}
  {{- end }}
  {{- range $name, $token := .Values.secrets.otelTokens }}
  otel-token-{{ $name | lower }}: {{ $token | quote }}
  {{- end }}
  {{- with .Values.secrets.intakeFleetToken }}
  intake-fleet-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.intakeFleetTokenPrevious }}
  intake-fleet-token-previous: {{ . | quote }}
  {{- end }}
  {{- if .Values.intake.enabled }}
  {{- range $name := .Values.intake.fleet.orgs }}
  {{- $entry := get ($.Values.secrets.intakeFleetTokens | default dict) $name | default dict }}
  intake-fleet-token-{{ $name | lower }}: {{ $entry.current | required (printf "secrets.intakeFleetTokens.%s.current is required for intake.fleet.orgs %s (or set secrets.existingSecret with an intake-fleet-token-%s key): without it the intake skips that fleet and refuses its laptops with 401" $name $name ($name | lower)) | quote }}
  {{- with $entry.previous }}
  intake-fleet-token-{{ $name | lower }}-previous: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $name, $token := .Values.secrets.intakeTokens }}
  intake-token-{{ $name | lower }}: {{ $token | quote }}
  {{- end }}
  {{- if .Values.collector.enabled }}
  {{- range $name := include "forgd-verdict.sinkTokenNames" . | fromJsonArray }}
  {{- $key := include "forgd-verdict.keySuffix" $name }}
  sink-token-{{ $key }}: {{ get ($.Values.secrets.sinkTokens | default dict) $key | required (printf "secrets.sinkTokens.%s is required: the policy's sinks name $FORGD_SINK_TOKEN_%s (or set secrets.existingSecret with a sink-token-%s key)" $key $name $key) | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.verdict.enabled }}
  {{- range $name := include "forgd-verdict.sharedHeaderNames" . | fromJsonArray }}
  {{- if $name }}
  {{- $key := include "forgd-verdict.keySuffix" $name }}
  shared-header-{{ $key }}: {{ get ($.Values.secrets.sharedHeaders | default dict) $key | required (printf "secrets.sharedHeaders.%s is required: the policy's server.required_headers names $FORGD_SHARED_HEADER_%s (or set secrets.existingSecret with a shared-header-%s key)" $key $name $key) | quote }}
  {{- else }}
  shared-header: {{ $.Values.secrets.sharedHeader | required "secrets.sharedHeader is required: the policy's server.required_headers names $FORGD_SHARED_HEADER (or set secrets.existingSecret with a shared-header key)" | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $name, $token := .Values.secrets.managedAgentsKeys }}
  managed-agents-key-{{ $name | lower }}: {{ $token | quote }}
  {{- end }}
{{- end }}
