{{- if .Values.networkPolicy.enabled }}
{{/*
One NetworkPolicy per role that has a Service. Each admits ingress on the
role's own port from the ingress controller's pods and from extraFrom
(dashboardExtraFrom for the dashboard), and nothing else; a pod selected by
any NetworkPolicy refuses what none admits. A role with no peers gets
`ingress: []`, which admits nothing: a rule with no `from` would admit every
source. Egress is left alone.
*/}}
{{- $np := .Values.networkPolicy }}
{{- $ic := $np.ingressController }}
{{- if not (or $ic.namespaceSelector $ic.podSelector $np.extraFrom) }}
{{- fail "networkPolicy.enabled needs networkPolicy.ingressController.namespaceSelector and podSelector, the ingress controller's namespace and pods, or networkPolicy.extraFrom for a load balancer that reaches the pods directly (and networkPolicy.dashboardExtraFrom for the dashboard). With neither, every role would refuse all traffic." }}
{{- end }}
{{- if and (or $ic.namespaceSelector $ic.podSelector) (not (and $ic.namespaceSelector $ic.podSelector)) }}
{{- fail "networkPolicy.ingressController needs both namespaceSelector and podSelector. A namespaceSelector alone admits every pod in those namespaces, and a podSelector alone matches only pods in the release's namespace." }}
{{- end }}
{{- $roles := list }}
{{- range $role := list "verdict" "collector" "dashboard" "intake" "connector" }}
{{- if (index $.Values $role).enabled }}{{ $roles = append $roles $role }}{{ end }}
{{- end }}
{{- range $role := $roles }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forgd-verdict.fullname" $ }}-{{ $role }}
  labels:
    {{- include "forgd-verdict.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "forgd-verdict.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  policyTypes:
    - Ingress
  {{- $extra := ternary $np.dashboardExtraFrom $np.extraFrom (eq $role "dashboard") }}
  {{- if or $ic.namespaceSelector $extra }}
  ingress:
    - from:
        {{- if $ic.namespaceSelector }}
        - namespaceSelector:
            {{- toYaml $ic.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $ic.podSelector | nindent 12 }}
        {{- end }}
        {{- with $extra }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
